spring.application.name=analytics-service
server.port=${PORT:8082}
info.app.name=Analytics Service
info.app.description=Stores and summarizes gateway access events

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/gatekeeper}
spring.data.mongodb.auto-index-creation=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
spring.kafka.consumer.group-id=analytics-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=false

gatekeeper.admin-api-key=${GATEKEEPER_ADMIN_KEY:dev-admin-key}
gatekeeper.access-topic=gateway.access.events

logging.pattern.level=%5p [${spring.application.name:},%X{correlationId:-}]
