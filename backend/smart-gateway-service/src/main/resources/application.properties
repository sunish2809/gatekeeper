spring.application.name=smart-gateway-service
server.port=${PORT:8080}
info.app.name=Smart Gateway Service
info.app.description=Custom API Gateway for routing, security and traffic management

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.repositories.enabled=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
spring.kafka.consumer.group-id=smart-gateway-${random.uuid}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.missing-topics-fatal=false

gatekeeper.management-url=${GATEKEEPER_MANAGEMENT_URL:http://localhost:8081}
gatekeeper.admin-api-key=${GATEKEEPER_ADMIN_KEY:dev-admin-key}
gatekeeper.jwt.secret=${GATEKEEPER_JWT_SECRET:gatekeeper-dev-jwt-secret-change-me-32b}
gatekeeper.config-topic=gateway.config.changed
gatekeeper.access-topic=gateway.access.events
gatekeeper.config-refresh-ms=30000
gatekeeper.max-body-bytes=1048576

logging.pattern.level=%5p [${spring.application.name:},%X{correlationId:-}]
