spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
gatekeeper.admin-api-key=${GATEKEEPER_ADMIN_KEY}
gatekeeper.jwt.secret=${GATEKEEPER_JWT_SECRET}
gatekeeper.gateway-url=${GATEKEEPER_GATEWAY_URL}
gatekeeper.analytics-url=${GATEKEEPER_ANALYTICS_URL}
gatekeeper.frontend-origin=${GATEKEEPER_FRONTEND_ORIGIN}
gatekeeper.platform.email=${GATEKEEPER_PLATFORM_EMAIL}
gatekeeper.platform.password=${GATEKEEPER_PLATFORM_PASSWORD}
gatekeeper.platform.name=${GATEKEEPER_PLATFORM_NAME:Platform Admin}
gatekeeper.contact-email=${GATEKEEPER_CONTACT_EMAIL:}
gatekeeper.demo.enabled=${GATEKEEPER_DEMO_ENABLED:true}
gatekeeper.demo.email=${GATEKEEPER_DEMO_EMAIL:priya@demo.gatekeeper}
gatekeeper.demo.password=${GATEKEEPER_DEMO_PASSWORD:demo-pass}
gatekeeper.demo.admin-name=${GATEKEEPER_DEMO_ADMIN_NAME:Priya Sharma}
gatekeeper.demo.org-name=${GATEKEEPER_DEMO_ORG_NAME:Demo Kitchen}
gatekeeper.demo.slug=${GATEKEEPER_DEMO_SLUG:demo}
server.forward-headers-strategy=framework
