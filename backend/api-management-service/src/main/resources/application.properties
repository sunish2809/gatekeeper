spring.application.name=api-management-service
server.port=${PORT:8081}
info.app.name=API Management Service
info.app.description=Stores routes, rate limits, and security policies

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3307}/${MYSQLDATABASE:gatekeeper}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:${MYSQL_USER:root}}
spring.datasource.password=${MYSQLPASSWORD:${MYSQL_PASSWORD:root}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

gatekeeper.admin-api-key=${GATEKEEPER_ADMIN_KEY:dev-admin-key}
gatekeeper.jwt.secret=${GATEKEEPER_JWT_SECRET:gatekeeper-dev-jwt-secret-change-me-32b}
gatekeeper.jwt.ttl-hours=24
gatekeeper.config-topic=gateway.config.changed
gatekeeper.gateway-url=${GATEKEEPER_GATEWAY_URL:http://localhost:8080}
gatekeeper.analytics-url=${GATEKEEPER_ANALYTICS_URL:http://localhost:8082}
gatekeeper.frontend-origin=${GATEKEEPER_FRONTEND_ORIGIN:http://localhost:5174}
gatekeeper.oidc.enabled=${GATEKEEPER_OIDC_ENABLED:false}
gatekeeper.oidc.google.client-id=${GOOGLE_OIDC_CLIENT_ID:}
gatekeeper.oidc.google.client-secret=${GOOGLE_OIDC_CLIENT_SECRET:}
gatekeeper.platform.email=${GATEKEEPER_PLATFORM_EMAIL:platform@gatekeeper.local}
gatekeeper.platform.password=${GATEKEEPER_PLATFORM_PASSWORD:platform-admin-change-me}
gatekeeper.platform.name=${GATEKEEPER_PLATFORM_NAME:Platform Admin}
gatekeeper.contact-email=${GATEKEEPER_CONTACT_EMAIL:hello@gatekeeper.local}

logging.pattern.level=%5p [${spring.application.name:},%X{correlationId:-}]
